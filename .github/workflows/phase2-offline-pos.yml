name: phase2-offline-pos
on:
  push:
    branches: [main]
  pull_request:
jobs:
  phase2-offline-pos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasira_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kasira_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run check
      - name: Offline POS unit and state-machine tests
        run: npm run test:offline
      - name: Offline integration evidence
        run: npm run offline:integration
      - name: Verify canonical Phase 1 migrations still apply
        env: {PGPASSWORD: postgres}
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U postgres -d kasira_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Phase 2 gate marker
        run: echo "PHASE 2 OFFLINE POS GATE EXECUTED"
