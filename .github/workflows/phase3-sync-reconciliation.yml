name: phase3-sync-reconciliation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  phase3-sync-reconciliation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasira_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kasira_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run check
      - run: npm run test:offline
      - name: Sync and reconciliation tests
        run: npm run test:sync
      - name: Phase 3 integration evidence
        run: npm run phase3:integration
      - name: Apply canonical migrations
        env: {PGPASSWORD: postgres}
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql -h 127.0.0.1 -U postgres -d kasira_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Verify Phase 3 RLS
        env: {PGPASSWORD: postgres}
        run: |
          psql -h 127.0.0.1 -U postgres -d kasira_test -v ON_ERROR_STOP=1 -c "SELECT relname, relrowsecurity, relforcerowsecurity FROM pg_class WHERE relnamespace='kasira'::regnamespace AND relname IN ('sync_inbox','device_sync_cursor','sync_telemetry','reconciliation_run') ORDER BY relname;"
      - run: echo "PHASE 3 SYNC RECONCILIATION GATE EXECUTED"
